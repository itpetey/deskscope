# Example Deskscope configuration file.
# Pass it at startup with:
#   deskscope --config /usr/local/etc/deskscope.toml

# Directory where "Take photo" saves timestamped PNGs.
# The directory is created automatically if it does not exist.
photo_directory = "/home/pi/photos"

# Number of seconds of inactivity before automatically powering off the display.
# Set to 0 or omit to disable auto power-off.
# power_off_after_secs = 300
