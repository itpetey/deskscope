[package]
name = "deskscope"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
drm-fourcc = "2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
libcamera = { version = "0.7", features = ["vendor_rpi"] }
serde = { version = "1.0", features = ["derive"] }
softbuffer = "0.4"
toml = "1.1"
winit = "0.30"
rppal = "0.22"
